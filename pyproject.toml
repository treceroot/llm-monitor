[project]
name = "llm-monitor"
version = "0.1.0"
description = "Terminal monitor for llama.cpp + GPU/CPU/RAM usage"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "nvidia-ml-py>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-monitor = "llm_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
